<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Liste des patients</title>

<style>
html,body{
height:100%;
margin:0;
}

body{
font-family:Arial;
background:url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center fixed;
background-size:cover;
padding:10px;
}

/* CONTAINER */
.container{
width:70%;
min-height:200px;
margin:1px auto;
background:rgba(255,255,255,0.85);
padding:15px;
border-radius:13px;
box-shadow:0 0 12px rgba(0,0,0,0.12);
backdrop-filter:blur(4px);
}

/* LOGOS (TWO LOGOS) */
.logos{
display:flex;
justify-content:center;
align-items:center;
gap:40px;
margin-bottom:10px;
}

.logo{
width:320px;
max-width:45%;
display:block;
margin:0 auto 10px auto;
border-radius:10px;
}

h2{text-align:center;color:#0b1a33}

.top-bar button{
transition:0.3s;
}

.top-bar button:hover{
box-shadow:0 0 12px #d4af37, 0 0 25px rgba(212,175,55,0.6);
transform:scale(1.05);
}

/* TOP */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:#0b1a33;
padding:10px;
border-radius:10px;
margin-bottom:12px;
}

.top-bar button, .top-bar input[type="submit"]{
background:#d4af37;
color:#0b1a33;
border:none;
padding:6px 12px;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

input[type="file"]{color:#d4af37}

/* SEARCH */
.search-box{
position:relative;
width:100%;
display:flex;
align-items:center;
}

.search-box input{
width:100%;
padding:10px 45px 10px 12px;
border-radius:10px;
border:1px solid #0b1a33;
outline:none;
transition:0.3s;
font-size:13px;
}

.search-box input:focus{
border-color:#d4af37;
box-shadow:0 0 10px rgba(212,175,55,0.5);
}

.search-box button{
position:absolute;
right:5px;
top:50%;
transform:translateY(-50%);
background:#0b1a33;
color:#d4af37;
border:none;
width:34px;
height:34px;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.search-box button:hover{
background:#d4af37;
color:#0b1a33;
box-shadow:0 0 10px #d4af37;
}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#0b1a33;color:#d4af37}
td{cursor:pointer;}
tbody tr:hover{background:#d4af37;color:#0b1a33}

.delete-btn{
background:#e74c3c;
color:white;
border:none;
padding:5px 8px;
cursor:pointer;
border-radius:4px;
}

/* EDIT */
td.editing{
background:#fff8dc;
box-shadow:0 0 10px #d4af37;
}

td.success{
background:#2ecc71 !important;
color:white;
transition:0.3s;
}

/* TOAST */
#toast{
position:fixed;
bottom:20px;
right:20px;
background:#0b1a33;
color:#d4af37;
padding:12px 18px;
border-radius:8px;
box-shadow:0 0 15px #d4af37;
display:none;
font-weight:bold;
overflow:hidden;
}

#toast::after{
content:"";
position:absolute;
left:0;
bottom:0;
height:3px;
width:100%;
background:#d4af37;
animation:progress 2s linear forwards;
}
@keyframes progress{from{width:100%}to{width:0%}}

/* CONFIRM */
#confirmBox{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
z-index:999;
}
#confirmBox.show{display:flex;}

.confirm-content{
background:#0b1a33;
padding:25px;
border-radius:12px;
text-align:center;
box-shadow:0 0 25px #d4af37;
width:300px;
}
.confirm-content h3{color:#d4af37}
.confirm-content p{color:white;margin:15px 0}

.confirm-buttons button{
margin:5px;
padding:8px 15px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}
#confirmYes{background:#d4af37;color:#0b1a33}
#confirmNo{background:#ccc}

/* PAGINATION */
#paginationBox{
text-align:center;
margin-top:15px;
}

#paginationBox button{
margin:3px;
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
background:#0b1a33;
color:#d4af37;
font-weight:bold;
transition:0.25s;
}

#paginationBox button:hover{
box-shadow:0 0 10px #d4af37;
transform:scale(1.05);
}

#paginationBox button.active{
background:#d4af37;
color:#0b1a33;
}

/* JUMP INPUT (ENHANCED) */
#jumpInput{
padding:8px;
width:90px;
border-radius:10px;
border:1px solid #0b1a33;
background:#0b1a33;
color:#d4af37;
text-align:center;
margin-top:8px;
transition:0.3s;
}

#jumpInput:focus{
box-shadow:0 0 10px #d4af37, 0 0 25px rgba(212,175,55,0.5);
transform:scale(1.05);
outline:none;
}

/* FOOTER */
.footer{
text-align:center;
margin-top:8px;
padding:10px;
color:#0b1a33;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="logos">
<img src="{{ url_for('static', filename='logine2.png') }}" class="logo">
<img src="{{ url_for('static', filename='logine1.png') }}" class="logo">
</div>

<h2>Liste des patients</h2>

<div class="top-bar">
<form method="POST" enctype="multipart/form-data">
<input type="file" name="excel_file" required>
<input type="submit" value="Importer Excel">
</form>

<div>
<button onclick="location.href='/dashboard'">Retour</button>

<!-- CHANGED BEHAVIOR -->
<button onclick="setSort('desc'); firstPage()">⬇ Les récents</button>
<button onclick="setSort('asc'); lastPage()">⬆ Les anciens</button>

</div>
</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Rechercher...">
<button onclick="loadPatients()">🔍</button>
</div>

<table>
<thead>
<tr>
<th>N°</th>
<th>Nom</th>
<th>Sexe</th>
<th>Age</th>
<th>Adresse</th>
<th>GDC</th>
<th>Date</th>
<th>Cas</th>
<th>Supprimer</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div id="paginationBox">
<button onclick="firstPage()">⏮ Première</button>
<button onclick="prevPage()">⬅ Précédent</button>
<span id="pagesNumbers"></span>
<button onclick="nextPage()">Suivant ➡</button>
<button onclick="lastPage()">Dernière ⏭</button>
<br>
<input id="jumpInput" type="number" placeholder="Page #">
<button onclick="jumpToPage()" style="background:#d4af37;color:#0b1a33;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;">Go</button>
</div>

<div class="footer">
Tous droits réservés 2026 © - Centre de Santé Rural Niveau 2 - ASDIF
</div>

</div>

<div id="toast">✔ Patient supprimé</div>

<div id="confirmBox">
  <div class="confirm-content">
    <h3>Confirmation</h3>
    <p>Supprimer ce patient ?</p>
    <div class="confirm-buttons">
      <button id="confirmNo">Non</button>
      <button id="confirmYes">Oui</button>
    </div>
  </div>
</div>

<script>

let currentSort="asc";
let currentPage=1;
let totalPages=0;
let selectedRow=null;

const beep=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

/* LOAD */
function loadPatients(){

let term = document.getElementById("searchInput").value.trim();

fetch(`/search_patients_global?term=${term}&sort=${currentSort}&page=${currentPage}`)
.then(r=>r.json())
.then(res=>{

let data=res.data;
totalPages=Math.ceil(res.total/10);

let tbody=document.getElementById("tbody");
tbody.innerHTML="";

data.forEach(p=>{
tbody.innerHTML+=`
<tr data-id="${p.id}">
<td>${p.num}</td>
<td>${p.nom}</td>
<td>${p.sexe}</td>
<td>${p.age}</td>
<td>${p.adresse}</td>
<td>${p.gde_consultation}</td>
<td>${p.date ? p.date.split(' ')[0] : ''}</td>
<td>${p.cas}</td>
<td><button class="delete-btn">Supprimer</button></td>
</tr>`;
});

attachEvents();
renderPages();

});
}

/* EDIT + DELETE */
function attachEvents(){

document.querySelectorAll(".delete-btn").forEach(btn=>{
btn.onclick=function(){
selectedRow=this.closest("tr");
document.getElementById("confirmBox").classList.add("show");
};
});

document.querySelectorAll("#tbody td:not(:last-child)").forEach(cell=>{

cell.onclick=function(){

if(cell.classList.contains("editing")) return;

cell.classList.add("editing");
cell.contentEditable=true;
cell.focus();

function save(){

let row=cell.closest("tr");
let id=row.dataset.id;
let colIndex=cell.cellIndex;

cell.classList.remove("editing");
cell.contentEditable=false;

fetch("/update_cell",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:id,
column:colIndex,
value:cell.innerText
})
})
.then(()=>{
beep.play();
cell.classList.add("success");
setTimeout(()=>cell.classList.remove("success"),800);
});

}

cell.addEventListener("blur",save,{once:true});

};

});

}

/* PAGINATION */
function renderPages(){
let box=document.getElementById("pagesNumbers");
box.innerHTML="";

let start=Math.max(1,currentPage-2);
let end=Math.min(totalPages,start+4);

for(let i=start;i<=end;i++){
box.innerHTML+=`<button class="${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
}
}

function nextPage(){if(currentPage<totalPages){currentPage++;loadPatients();}}
function prevPage(){if(currentPage>1){currentPage--;loadPatients();}}
function firstPage(){currentPage=1;loadPatients();}
function lastPage(){currentPage=totalPages;loadPatients();}
function goToPage(p){currentPage=p;loadPatients();}

function jumpToPage(){
let p=parseInt(document.getElementById("jumpInput").value);
if(p>=1 && p<=totalPages){currentPage=p;loadPatients();}
}

function setSort(s){
currentSort=s;
currentPage=1;
loadPatients();
}

/* DELETE CONFIRM */
document.getElementById("confirmNo").onclick=()=>{
document.getElementById("confirmBox").classList.remove("show");
};

document.getElementById("confirmYes").onclick=()=>{
let id=selectedRow.dataset.id;

fetch("/delete_patient",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id:id})
})
.then(r=>r.json())
.then(res=>{
if(res.success){
selectedRow.remove();
beep.play();

document.getElementById("toast").style.display="block";
setTimeout(()=>document.getElementById("toast").style.display="none",2000);

document.getElementById("confirmBox").classList.remove("show");
loadPatients();
}
});
};

loadPatients();

</script>

</body>
</html>
