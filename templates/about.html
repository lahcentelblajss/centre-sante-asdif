<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<title>À propos du centre</title>

<style>
body{
font-family:Arial, sans-serif;
background:url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center;
background-size:cover;
margin:0;
padding:0;
text-align:center;
}

/* CONTAINER GLASS */
.container{
width:98%;
max-width:1250px;
margin:15px auto;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);
padding:20px;
border-radius:12px;
box-shadow:0 0 25px rgba(0,0,0,0.25);
}

/* LOGOS (نفس السطر) */
.logos{
display:flex;
justify-content:center;
align-items:center;
gap:50px;
margin-bottom:15px;
}

.logos img{
width:280px;
max-width:45%;
border-radius:10px;
object-fit:cover;
transition:0.3s;
}

.logos img:hover{
transform:scale(1.03);
box-shadow:0 0 20px rgba(212,175,55,0.6);
}

/* TITLE */
h2{
margin:8px 0 12px 0;
color:#0b1a33;
font-size:18px;
font-weight:bold;
}

/* GRID */
.facilities{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:12px;
}

/* CARD */
.card{
border-radius:10px;
padding:10px;
background:rgba(255,255,255,0.9);
text-align:center;
box-shadow:0 3px 8px rgba(0,0,0,0.12);
position:relative;
cursor:pointer;
transition:0.35s;
font-size:12px;
overflow:hidden;
}

.card:hover{
transform:translateY(-4px);
box-shadow:
0 0 10px rgba(212,175,55,0.6),
0 0 25px rgba(212,175,55,0.5),
0 0 60px rgba(212,175,55,0.35);
}

.card.active{
box-shadow:
0 0 15px rgba(212,175,55,0.8),
0 0 40px rgba(212,175,55,0.6);
}

/* ICON */
.icon{
font-size:34px;
margin-bottom:6px;
}

.text{
font-size:13px;
}

/* ADMIN TOOLS */
.admin-tools{
position:absolute;
top:5px;
right:5px;
opacity:0;
transform:translateY(-10px);
transition:0.3s;
display:flex;
gap:4px;
}

.card.active .admin-tools{
opacity:1;
transform:translateY(0);
}

.small-btn{
padding:4px 6px;
font-size:11px;
border:none;
border-radius:5px;
cursor:pointer;
background:#0b1a33;
color:#d4af37;
transition:0.2s;
}

.small-btn:hover{
transform:scale(1.1);
background:#111f3d;
}

/* FORM */
.form-box{
margin:10px 0;
padding:10px;
background:rgba(248,249,250,0.7);
border-radius:8px;
backdrop-filter:blur(4px);
}

input, select{
padding:8px;
border-radius:6px;
border:1px solid #ccc;
font-size:12px;
outline:none;
}

/* BUTTONS */
button{
padding:8px 10px;
background:#0b1a33;
color:#d4af37;
border:none;
border-radius:7px;
cursor:pointer;
font-weight:bold;
margin:4px;
font-size:12px;
transition:0.35s;
position:relative;
overflow:hidden;
}

button:hover{
box-shadow:0 0 15px rgba(212,175,55,0.8),
           0 0 30px rgba(212,175,55,0.4);
transform:scale(1.05);
}

button::before{
content:"";
position:absolute;
top:0;
left:-120%;
width:120%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(212,175,55,0.4),transparent);
transition:0.6s;
}

button:hover::before{
left:120%;
}

/* BOTTOM */
.bottom-bar{
display:flex;
justify-content:center;
gap:10px;
margin-top:12px;
}

/* FOOTER */
.footer{
margin-top:10px;
font-size:12px;
font-weight:bold;
color:#0b1a33;
}
</style>

<script>

let currentLang="fr";
let editId = null;

const icons = {
vestiaire:"🚻",
laboratoire:"🧪",
prelevement:"🩸",
soins_injection:"🩹💉",
consultation_medicale:"🩺",
urgences_observation:"🚨",
laverie:"🧺🧼",
dechets:"🗑️",
nettoyage:"🧼",
magasin:"📦",
administration:"🗂️",
reunions:"📋",
sterilisation:"🧴",
placenta:"🧫",
nouveau_nes:"👶",
cuisine:"🍳",
logements:"🏠",
cafetaria:"🍽️",
post_accouchement:"🤱",
consultation_enceintes:"🤰",
evenements_heureux:"🎉",
garde:"🛡️",
garde_personnelle:"👩‍🍼",
accouchement:"🤱",
smi_pf:"🤰👶",
sim_sr:"🤰",
pharmacie:"💊",
historique:"🕒"
};

function setActive(card){
document.querySelectorAll('.card').forEach(c=>{
c.classList.remove('active');
});
card.classList.add('active');
}

function toggleLang(){
currentLang = currentLang==='fr' ? 'ar' : 'fr';
document.documentElement.dir = currentLang==='ar' ? 'rtl' : 'ltr';

document.querySelectorAll('.text').forEach(t=>{
t.innerText = currentLang==='ar' ? t.dataset.ar : t.dataset.fr;
});
}

function addFacility(){

let text = document.getElementById("facilityText").value;
let type = document.getElementById("facilityType").value;

if(!text || !type) return;

let icon = icons[type];

if(editId){

fetch("/update_facility", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id: editId,
icon: icon,
name_fr: text,
name_ar: text
})
}).then(()=>{
editId = null;
location.reload();
});

}else{

fetch("/add_facility", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
icon: icon,
name_fr: text,
name_ar: text
})
}).then(()=>{
location.reload();
});
}

document.getElementById("facilityText").value="";
}

function editFacility(id, oldText){
document.getElementById("facilityText").value = oldText;
editId = id;
}

function deleteFacility(id){
fetch("/delete_facility", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id:id})
}).then(()=>location.reload());
}

</script>

</head>

<body>

<div class="container">

<!-- LOGOS نفس السطر -->
<div class="logos">
    <img src="{{ url_for('static', filename='logine2.png') }}">
    <img src="{{ url_for('static', filename='logine1.png') }}">
</div>

<h2>À propos du Centre de Santé Rural Niveau 2 - ASDIF</h2>

<div class="form-box">

<input type="text" id="facilityText" placeholder="Nom du service">

<select id="facilityType">
<option value="vestiaire">🚻 vestiaire</option>
<option value="laboratoire">🧪 Laboratoire</option>
<option value="prelevement">🩸 Salle de prélèvement</option>
<option value="soins_injection">🩹💉 1 Salle de soins et d’injection</option>
<option value="consultation_medicale">🩺 Consultations médicales</option>
<option value="urgences_observation">🚨 Urgences et observation</option>
<option value="laverie">🧺🧼 Laverie</option>
<option value="dechets">🗑️ Salle des déchets</option>
<option value="nettoyage">🧼 Stockage produits de nettoyage</option>
<option value="magasin">📦 Magasin</option>
<option value="administration">🗂️ Gestion administrative</option>
<option value="reunions">📋 Réunions</option>
<option value="sterilisation">🧴 Salle de stérilisation</option>
<option value="placenta">🧫 Salle bassin placentaire</option>
<option value="nouveau_nes">👶 Salle des nouveau-nés</option>
<option value="cuisine">🍳 Cuisine</option>
<option value="logements">🏠 Logements</option>
<option value="cafetaria">🍽️ Cafétéria</option>
<option value="post_accouchement">🤱 Salles post-accouchement</option>
<option value="consultation_enceintes">🤰 Consultation des femmes enceintes</option>
<option value="evenements_heureux">🎉 Événements heureux</option>
<option value="garde">🛡️ Salle de garde</option>
<option value="garde_personnelle">👩‍🍼 Salle de garde personnelle</option>
<option value="accouchement">🤱 Salles d’accouchement</option>
<option value="smi_pf">🤰👶 SMI/PF</option>
<option value="sim_sr">🤰 SIM/SR</option>
<option value="pharmacie">💊 Pharmacie</option>
<option value="historique">🕒 Historique</option>
</select>

<button onclick="addFacility()">➕ Ajouter</button>

</div>

<div class="facilities">

{% for f in facilities %}
<div class="card" onclick="setActive(this)">

<div class="icon">{{ f[1] }}</div>

<div class="text" data-fr="{{ f[2] }}" data-ar="{{ f[3] }}">
{{ f[2] }}
</div>

<div class="admin-tools">
<button class="small-btn" onclick="event.stopPropagation(); editFacility({{ f[0] }}, '{{ f[2] | escape }}')">✏</button>
<button class="small-btn" onclick="event.stopPropagation(); deleteFacility({{ f[0] }})">🗑</button>
</div>

</div>
{% endfor %}

</div>

<div class="bottom-bar">
<button onclick="location.href='/dashboard'">⬅ Retour</button>
<button onclick="toggleLang()">🌐 FR/AR</button>
</div>

<div class="footer">
Tous droits réservés 2026 © - Centre de Santé Rural Niveau 2 - ASDIF
</div>

</div>

</body>
</html>
