<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Campagnes</title>

<style>
body{
font-family:Arial;
background:url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center fixed;
background-size:cover;
margin:0;
padding:15px;
min-height:100vh;
}

/* CONTAINER */
.container{
width:90%;
max-width:1200px;
margin:auto;
background:rgba(255,255,255,0.70);
padding:15px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.15);
text-align:center;
}

/* LOGOS ROW */
.logo-row{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
margin:10px 0 20px 0;
}

.logo-row img{
width:280px;
max-width:100%;
height:auto;
object-fit:contain;
}

/* TITLE */
h2{
color:#0b1a33;
margin:10px 0 15px 0;
}

/* SELECT */
select{
padding:10px 15px;
border-radius:8px;
border:1px solid #ccc;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

select:hover{
box-shadow:0 0 12px #d4af37;
background:#fffdf5;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-top:15px;
}

.card{
position:relative;
background:white;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
padding:6px;
transition:0.3s;
}

.card:hover{
box-shadow:0 0 18px rgba(212,175,55,0.7);
transform:translateY(-3px);
}

.card img{
width:100%;
height:200px;
object-fit:contain;
background:#f8f9fb;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

.card img:hover{
box-shadow:0 0 18px rgba(212,175,55,0.9);
}

.title{font-size:13px;font-weight:bold;margin-top:5px;}
.cat{font-size:11px;color:#777;}

/* DELETE */
.delete{
position:absolute;
top:6px;
left:6px;
background:red;
color:white;
border:none;
padding:5px 7px;
border-radius:6px;
cursor:pointer;
font-size:11px;
transition:0.3s;
}

.delete:hover{
box-shadow:0 0 12px red;
transform:scale(1.1);
}

/* BUTTON GLOW */
button, .back-btn, .return-btn{
transition:0.3s;
}

button:hover, .back-btn:hover, .return-btn:hover{
box-shadow:0 0 12px #d4af37, 0 0 25px rgba(212,175,55,0.7);
transform:scale(1.05);
}

/* NAV */
.bottom-area{margin-top:20px;}

.back-btn{
padding:10px 18px;
background:#0b1a33;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin:0px;
text-decoration:none;
display:inline-block;
}

.footer{
margin-top:15px;
font-weight:bold;
color:#0b1a33;
border-top:1px solid #ddd;
padding-top:10px;
}

/* RETURN */
.return-btn{
padding:10px 25px;
background:#0b1a33;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
font-size:14px;
}

/* ✅ المسافة بين Pagination و Retour */
.return-area{
margin-top:30px;
}

/* ================= MODAL ================= */

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
justify-content:center;
align-items:center;
z-index:9999;
}

.modal img{
max-width:90%;
max-height:85%;
cursor:grab;
transition:transform 0.2s;
}

.close{
position:absolute;
top:20px;
right:30px;
font-size:30px;
color:white;
cursor:pointer;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<!-- LOGOS -->
<div class="logo-row">
  <img src="{{ url_for('static', filename='logine1.png') }}">
  <img src="{{ url_for('static', filename='logine2.png') }}">
</div>

<h2>📸 Campagnes de sensibilisation</h2>

<div style="margin-bottom:15px;">
<form method="get">
<select name="category" onchange="this.form.submit()">
<option value="all" {% if category=='all' %}selected{% endif %}>Tous</option>
<option value="Mère et enfant" {% if category=='Mère et enfant' %}selected{% endif %}>Mère et enfant</option>
<option value="Santé publique" {% if category=='Santé publique' %}selected{% endif %}>Santé publique</option>
<option value="Maladies chroniques" {% if category=='Maladies chroniques' %}selected{% endif %}>Maladies chroniques</option>
<option value="Maladies générales" {% if category=='Maladies générales' %}selected{% endif %}>Maladies générales</option>
<option value="Annonce" {% if category=='Annonce' %}selected{% endif %}>Annonce</option>
</select>
</form>
</div>

<div class="gallery">
{% for img in images %}
<div class="card">

<img src="{{ url_for('static', filename='uploads/' + img[1]) }}"
onclick="openModal(this.src)">

<button class="delete" onclick="deleteImage({{ img[0] }}, this)">🗑</button>

<div class="title">{{ img[2] }}</div>
<div class="cat">{{ img[3] }}</div>

</div>
{% endfor %}
</div>

<div class="bottom-area">

{% if page > 1 %}
<a class="back-btn" href="/campaigns?page={{ page-1 }}&category={{ category }}">⬅ Précédent</a>
{% endif %}

<span style="font-weight:bold;margin:0 10px;">
Page {{ page }} / {{ total_pages }}
</span>

{% if page < total_pages %}
<a class="back-btn" href="/campaigns?page={{ page+1 }}&category={{ category }}">Suivant ➡</a>
{% endif %}

</div>

<div class="return-area">
<button class="return-btn" onclick="location.href='/info'">
⬅ Retour
</button>
</div>

<div class="footer">
Tous droits réservés 2026 © - Centre de Santé Rural Niveau 2 - ASDIF
</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<span class="close" onclick="closeModal()">✖</span>
<img id="modalImg">
</div>

<script>
let scale = 1;
let posX = 0, posY = 0;
let isDragging = false;
let startX, startY;

const modal = document.getElementById("modal");
const img = document.getElementById("modalImg");

function openModal(src){
modal.style.display="flex";
img.src = src;
scale = 1;
posX = 0;
posY = 0;
updateTransform();
}

function closeModal(){
modal.style.display="none";
}

function updateTransform(){
img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
}

/* ZOOM WHEEL */
img.addEventListener("wheel", function(e){
e.preventDefault();
scale += e.deltaY * -0.001;
scale = Math.min(Math.max(1, scale), 5);
updateTransform();
});

/* DOUBLE CLICK ZOOM */
img.addEventListener("dblclick", function(){
scale = scale === 1 ? 2 : 1;
updateTransform();
});

/* DRAG */
img.addEventListener("mousedown", function(e){
isDragging = true;
startX = e.clientX - posX;
startY = e.clientY - posY;
img.style.cursor="grabbing";
});

document.addEventListener("mouseup", function(){
isDragging = false;
img.style.cursor="grab";
});

document.addEventListener("mousemove", function(e){
if(!isDragging) return;
posX = e.clientX - startX;
posY = e.clientY - startY;
updateTransform();
});

/* CLOSE CLICK OUTSIDE */
modal.addEventListener("click", function(e){
if(e.target === modal){
closeModal();
}
});
</script>

</body>
</html>
