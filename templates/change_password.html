<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Changer mot de passe</title>

<style>
body{
font-family:Arial, sans-serif;
background:url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center;
background-size:cover;
margin:0;
text-align:center;
}

/* CONTAINER GLASS */
.container{
width:800px;
margin:40px auto;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);
padding:40px;
border-radius:15px;
box-shadow:0 0 25px rgba(0,0,0,0.25);
}

/* LOGOS داخل المربع */
.logos{
display:flex;
justify-content:center;
align-items:center;
gap:40px;
margin-bottom:20px;
}

.logos img{
width:260px;
border-radius:10px;
object-fit:cover;
}

/* TITLE */
h2{
color:#0b1a33;
margin-bottom:25px;
font-size:20px;
font-weight:bold;
letter-spacing:0.5px;
}

/* INPUTS */
.input-box{
position:relative;
width:95%;
margin:14px auto;
}

.input-box input{
width:100%;
padding:14px 45px 14px 14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
outline:none;
transition:0.3s;
}

.input-box input:focus{
border:1px solid #d4af37;
box-shadow:0 0 12px rgba(212,175,55,0.6);
}

.eye{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

/* STRENGTH */
#strength{
width:95%;
margin:8px auto;
font-weight:bold;
font-size:14px;
text-align:left;
}

/* BUTTONS */
button{
width:98%;
padding:14px;
background:#0b1a33;
color:#d4af37;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
margin-top:12px;
font-weight:bold;
transition:0.35s;
position:relative;
overflow:hidden;
}

/* GLOW */
button:hover{
box-shadow:0 0 15px rgba(212,175,55,0.9),
           0 0 30px rgba(212,175,55,0.4);
transform:translateY(-2px) scale(1.02);
}

/* LIGHT EFFECT */
button::before{
content:"";
position:absolute;
top:0;
left:-120%;
width:120%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(212,175,55,0.4),transparent);
transition:0.6s;
}

button:hover::before{
left:120%;
}

/* TOAST */
.toast{
position:fixed;
top:20px;
right:20px;
padding:12px 18px;
border-radius:10px;
color:white;
font-weight:bold;
display:none;
z-index:999;
}

.success{background:#1e7d3a;}
.error{background:#b30000;}

/* FOOTER */
.footer{
margin-top:25px;
font-size:15px;
font-weight:bold;
color:#0b1a33;
background:linear-gradient(90deg,#0b1a33,#d4af37);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
</style>
</head>

<body>

<div class="container">

<!-- 🔥 LOGOS داخل المربع -->
<div class="logos">
<img src="{{ url_for('static', filename='logine2.png') }}">
<img src="{{ url_for('static', filename='logine1.png') }}">
</div>

<h2>Changer mot de passe</h2>

<audio id="beep" src="{{ url_for('static', filename='Beep25.wav') }}"></audio>

<div class="input-box">
<input type="password" id="oldpass" placeholder="Ancien mot de passe">
<span class="eye" onclick="toggle('oldpass',this)">👁</span>
</div>

<div class="input-box">
<input type="password" id="newpass" placeholder="Nouveau mot de passe" oninput="checkStrength()">
<span class="eye" onclick="toggle('newpass',this)">👁</span>
</div>

<div id="strength">Force: -</div>

<div class="input-box">
<input type="password" id="confirm" placeholder="Confirmer nouveau mot de passe">
<span class="eye" onclick="toggle('confirm',this)">👁</span>
</div>

<button onclick="changePassword()">Modifier</button>
<button onclick="location.href='/dashboard'">Retour</button>

<div class="footer">
Tous droits réservés 2026 © - Centre de Santé Rural Niveau 2 - ASDIF
</div>

</div>

<div id="toast" class="toast"></div>

<script>

function toggle(id,el){
let i=document.getElementById(id);
if(i.type==="password"){
i.type="text";el.textContent="🙈";
}else{
i.type="password";el.textContent="👁";
}
}

function checkStrength(){
let p=document.getElementById("newpass").value;
let s=document.getElementById("strength");

let score=0;
if(p.length>=6)score++;
if(p.match(/[A-Z]/))score++;
if(p.match(/[0-9]/))score++;
if(p.match(/[^A-Za-z0-9]/))score++;

if(p.length===0){
s.textContent="Force: -";
s.style.color="black";
}
else if(score<=1){
s.textContent="Force: Faible";
s.style.color="red";
}
else if(score<=3){
s.textContent="Force: Moyenne";
s.style.color="orange";
}
else{
s.textContent="Force: Forte";
s.style.color="green";
}
}

function toast(msg,type){
let t=document.getElementById("toast");
t.className="toast "+type;
t.textContent=msg;
t.style.display="block";
document.getElementById("beep").play();
setTimeout(()=>{t.style.display="none";},3000);
}

function changePassword(){

let oldp=document.getElementById("oldpass").value;
let newp=document.getElementById("newpass").value;
let conf=document.getElementById("confirm").value;

if(oldp===newp){
toast("Nouveau mot de passe identique à l'ancien","error");
return;
}

if(newp!==conf){
toast("Les mots de passe ne correspondent pas","error");
return;
}

fetch("/change_password",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
old_password:oldp,
new_password:newp
})
})
.then(r=>r.json())
.then(d=>{
if(d.status==="success"){
toast("Mot de passe modifié avec succès","success");

document.getElementById("oldpass").value="";
document.getElementById("newpass").value="";
document.getElementById("confirm").value="";
document.getElementById("strength").textContent="Force: -";
}
else{
toast("Mot de passe original incorrect","error");
}
})
.catch(()=>{
toast("Erreur serveur","error");
});
}

</script>

</body>
</html>
