<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Système de gestion du Centre de Santé Rural 2éme Niveau - ASDIF</title>

<!-- 🔥 خط أنيق للعناوين -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:Arial, sans-serif;
    margin:0;
    padding:0;
    text-align:center;

    background:url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center;
    background-size:cover;

    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* 🔷 CONTAINER */
.container{
    width:800px;
    max-width:95%;

    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    padding:45px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.25);

    box-shadow:0 8px 25px rgba(0,0,0,0.25);
}

/* 🔥 LOGOS */
.logos{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    margin-bottom:30px;
}

.logos img{
    width:298px;
    height:auto;
    object-fit:cover;
    border-radius:10px;
}

/* ===================== 🔥 TITLE ===================== */
h2{
    margin:10px 0 55px 0;   /* المسافة بين العنوان والأزرار */
    color:#0b1a33;

    font-family: Constantia, "Times New Roman", serif; /* 🔥 الخط الجديد */
    font-size:24px;   /* 🔽 أصغر من قبل */
    font-weight:bold; /* 🔥 عريض */
    letter-spacing:0.3px;
}

/* GRID */
.buttons{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:20px;
    margin-top:10px;
}

/* 🔥 BUTTONS */
button{
    padding:18px;
    font-size:15px;
    font-weight:bold;
    border:none;
    border-radius:15px;
    cursor:pointer;

    background:rgba(255,255,255,0.35);
    color:#0b1a33;

    box-shadow:0 3px 10px rgba(0,0,0,0.12);

    transition:all 0.35s ease;
    position:relative;
    overflow:hidden;
}

button::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:120%;
    height:100%;
    background:linear-gradient(120deg,transparent,rgba(212,175,55,0.3),transparent);
    transition:0.6s;
}

button:hover{
    background:rgba(11,26,51,0.92);
    color:#d4af37;
    transform:translateY(-4px) scale(1.03);
    box-shadow:0 0 15px #d4af37, 0 0 30px rgba(212,175,55,0.3);
}

button:hover::before{
    left:120%;
}

/* footer */
.footer{
    margin-top:35px;
    font-size:15px;
    font-weight:bold;
    color:#0b1a33;
}

/* 🔔 notif */
#notifBell{
    position:fixed;
    top:20px;
    right:20px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#0b1a33;
    color:#d4af37;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
    z-index:9999;
}

#notifCount{
    position:absolute;
    top:-5px;
    right:-5px;
    width:20px;
    height:20px;
    background:red;
    color:white;
    font-size:12px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

#notifBox{
    position:fixed;
    top:85px;
    right:20px;
    width:280px;

    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(6px);

    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);

    display:none;
    z-index:9999;
}

#notifBox h4{
    margin:0;
    padding:10px;
    background:#0b1a33;
    color:#d4af37;
    border-radius:12px 12px 0 0;
}

#notifList{
    padding:10px;
    font-size:14px;
    color:#333;
}
</style>
</head>

<body>

<div id="notifBell" onclick="toggleNotifList()">
🔔
<span id="notifCount">0</span>
</div>

<div id="notifBox">
    <h4>Notifications</h4>
    <div id="notifList">Aucune notification</div>
</div>

<div class="container">

    <!-- 🔥 LOGOS -->
    <div class="logos">
        <img src="{{ url_for('static', filename='logine2.png') }}">
        <img src="{{ url_for('static', filename='logine1.png') }}">
    </div>

    <!-- 🔥 TITLE -->
    <h2>Système de gestion du Centre de Santé Rural 2éme Niveau - ASDIF</h2>

    <div class="buttons">

        <button onclick="location.href='/patients'">🧾 Enregistrer les patients</button>
        <button onclick="location.href='/statistiques'">📊 Statistiques</button>
        <button onclick="location.href='/rapports'">📄 Rapports</button>
        <button onclick="location.href='/staff'">👥 Personnel & Utilisateurs</button>
        <button onclick="location.href='/users'">🛠 Gestion des utilisateurs</button>
        <button onclick="location.href='/change_password'">🔒 Changer mot de passe</button>
        <button onclick="location.href='/about'">ℹ️ À propos du centre</button>
        <button onclick="location.href='/patients_list'">📋 Liste des patients</button>
        <button onclick="location.href='/info'">📢 Information & Communication</button>
        <button onclick="location.href='/appointments'">📅 Rendez-vous</button>
        <button onclick="location.href='/pharmacy'">💊 Pharmacie</button>
        <button onclick="location.href='/logout'">🚪 Déconnexion</button>

    </div>

    <div class="footer">
        Tous droits réservés 2026 © - Centre de Santé Rural Niveau 2 - ASDIF
    </div>

</div>

<script>
let notifOpen = false;

function toggleNotifList(){
    notifOpen = !notifOpen;
    document.getElementById("notifBox").style.display = notifOpen ? "block" : "none";

    if (notifOpen){
        document.getElementById("notifCount").innerText = "0";
    }
}

function loadNotifications(){
    fetch("/notifications")
    .then(res => res.json())
    .then(data => {

        document.getElementById("notifCount").innerText = data.length;

        let box = document.getElementById("notifList");

        if(data.length === 0){
            box.innerHTML = "Aucune notification";
        } else {
            box.innerHTML = "";
            data.forEach(n => {
                box.innerHTML += `
                    <div style="padding:8px;border-bottom:1px solid #eee;">
                        📅 ${n.type}<br>
                        👤 ${n.nom}
                    </div>
                `;
            });
        }
    });
}

setInterval(loadNotifications, 20000);
loadNotifications();
</script>

</body>
</html>
